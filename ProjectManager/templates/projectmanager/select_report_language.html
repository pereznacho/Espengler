{% extends "base.html" %}
{% load static %}

{% block title %}Select Report Language — Espengler{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="es-card" style="max-width: 480px; margin: 0 auto;">
        <h2 class="mb-4" style="color: var(--es-accent);">Select Report Language</h2>
        <p style="color: var(--es-text-secondary); margin-bottom: var(--es-spacing-md);">Choose the language for the generated report.</p>
        <form method="post" action="{% url 'generate_report' project_id=project_id %}">
            {% csrf_token %}
            <div class="form-group">
                <label for="language" style="color: var(--es-text-secondary);">Language</label>
                <select class="form-control" id="language" name="language">
                    <option value="en">English</option>
                    <option value="es">Spanish</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Generate Report</button>
        </form>
    </div>
</div>
{% endblock %}
