{% extends "admin/base.html" %}
{% load static i18n %}

{% block title %}Administration Panel - EspEngler{% endblock %}

{% block extrastyle %}
    {{ block.super }}
    <!-- Custom styles -->
    <link rel="stylesheet" type="text/css" href="{% static 'css/custom.css' %}" id="custom-css">
    <link rel="stylesheet" type="text/css" href="{% static 'css/fix_select2.css' %}">
{% endblock %}

{% block extrahead %}
    {{ block.super }}

    <!-- jQuery for Select2 (if not already loaded) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- Fix para Select2 -->
    <script src="{% static 'js/fix_select2.js' %}"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            setTimeout(function () {
                // Inject styles if they did not load
                const stylesToCheck = ["custom.css", "fix_select2.css"];

                stylesToCheck.forEach(function (filename) {
                    const isLoaded = Array.from(document.styleSheets).some(sheet => sheet.href && sheet.href.includes(filename));

                    if (!isLoaded) {
                        const link = document.createElement("link");
                        link.href = "{% static 'css/" + filename + "' %}";
                        link.type = "text/css";
                        link.rel = "stylesheet";
                        document.head.appendChild(link);
                        console.log("✅ " + filename + " injected manually");
                    } else {
                        console.log("✅ " + filename + " already loaded");
                    }
                });

                // Adjust CKEditor editable area style if needed
                const editorArea = document.querySelector('.ck-editor__editable');
                if (editorArea) {
                    editorArea.style.color = "white";  // White text for dark background
                }
            }, 1000);  // Wait for DOM and CKEditor to finish loading
        });
    </script>
{% endblock %}

{% block content %}
    {{ block.super }}
{% endblock %}
